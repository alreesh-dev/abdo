# MoveIt -> ros2_control controller mapping for the Ignition Panda.
# The stock panda moveit_controllers.yaml only registers the arm, which is why
# the "hand" group fails to execute. This adds the gripper as a GripperCommand
# action (matching position_controllers/GripperActionController in
# panda_controllers.yaml, whose action server is panda_hand_controller/gripper_cmd).
trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01
  trajectory_duration_monitoring: true

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - panda_arm_controller
    - panda_hand_controller

  panda_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7

  panda_hand_controller:
    action_ns: gripper_cmd
    type: GripperCommand
    default: true
    joints:
      - panda_finger_joint1
