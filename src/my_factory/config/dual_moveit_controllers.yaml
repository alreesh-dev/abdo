trajectory_execution:
  allowed_execution_duration_scaling: 1.2
  allowed_goal_duration_margin: 0.5
  allowed_start_tolerance: 0.01
  trajectory_duration_monitoring: true

moveit_controller_manager: moveit_simple_controller_manager/MoveItSimpleControllerManager

moveit_simple_controller_manager:
  controller_names:
    - load_arm_controller
    - load_hand_controller
    - unload_arm_controller
    - unload_hand_controller

  load_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - load_joint1
      - load_joint2
      - load_joint3
      - load_joint4
      - load_joint5
      - load_joint6
      - load_joint7

  load_hand_controller:
    action_ns: gripper_cmd
    type: GripperCommand
    default: true
    joints:
      - load_finger_joint1

  unload_arm_controller:
    action_ns: follow_joint_trajectory
    type: FollowJointTrajectory
    default: true
    joints:
      - unload_joint1
      - unload_joint2
      - unload_joint3
      - unload_joint4
      - unload_joint5
      - unload_joint6
      - unload_joint7

  unload_hand_controller:
    action_ns: gripper_cmd
    type: GripperCommand
    default: true
    joints:
      - unload_finger_joint1