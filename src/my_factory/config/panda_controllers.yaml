# ros2_control controllers, loaded by the ign_ros2_control system plugin
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: position_controllers/GripperActionController

# Publish only the real model joints. ign_ros2_control exposes the mimic joint's
# state interface as "panda_finger_joint2_mimic", which MoveIt rejects ("Joint
# 'panda_finger_joint2_mimic' not found in model"). robot_state_publisher / MoveIt
# recompute panda_finger_joint2 from the URDF <mimic> tag, so we simply don't
# broadcast the suffixed artifact.
joint_state_broadcaster:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
      - panda_finger_joint1
    interfaces:
      - position
      - velocity

panda_arm_controller:
  ros__parameters:
    joints:
      - panda_joint1
      - panda_joint2
      - panda_joint3
      - panda_joint4
      - panda_joint5
      - panda_joint6
      - panda_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true

panda_hand_controller:
  ros__parameters:
    joint: panda_finger_joint1
    allow_stalling: true
