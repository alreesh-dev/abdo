controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    load_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    load_hand_controller:
      type: position_controllers/GripperActionController

    unload_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    unload_hand_controller:
      type: position_controllers/GripperActionController


joint_state_broadcaster:
  ros__parameters:
    use_sim_time: true
    joints:
      # مفاصل ذراع التحميل
      - load_joint1
      - load_joint2
      - load_joint3
      - load_joint4
      - load_joint5
      - load_joint6
      - load_joint7
      - load_finger_joint1
      # مفاصل ذراع التفريغ
      - unload_joint1
      - unload_joint2
      - unload_joint3
      - unload_joint4
      - unload_joint5
      - unload_joint6
      - unload_joint7
      - unload_finger_joint1
    interfaces:
      - position
      - velocity

load_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - load_joint1
      - load_joint2
      - load_joint3
      - load_joint4
      - load_joint5
      - load_joint6
      - load_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true

load_hand_controller:
  ros__parameters:
    use_sim_time: true
    joint: load_finger_joint1
    allow_stalling: true

unload_arm_controller:
  ros__parameters:
    use_sim_time: true
    joints:
      - unload_joint1
      - unload_joint2
      - unload_joint3
      - unload_joint4
      - unload_joint5
      - unload_joint6
      - unload_joint7
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_nonzero_velocity_at_trajectory_end: true

unload_hand_controller:
  ros__parameters:
    use_sim_time: true
    joint: unload_finger_joint1
    allow_stalling: true